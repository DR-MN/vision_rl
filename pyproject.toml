[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision_rl"
version = "0.1.0"
description = "Vision-based PPO on MuJoCo-JAX: single-robot Franka reach from pixels"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "flax",
    "optax",
    "mujoco",
    "mujoco-mjx",
    "numpy",
]

[project.optional-dependencies]
logging = ["wandb"]

[tool.setuptools.packages.find]
include = ["vision_rl*"]
